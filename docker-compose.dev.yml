# Developer override: hot-reload API from the working tree, published db/qdrant ports, local (non-production) mode.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Still needs SECRET_KEY and POSTGRES_PASSWORD (any values; dev mode does not enforce key strength).
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
  api:
    environment:
      ENVIRONMENT: local
      DEBUG: "true"
    volumes:
      - ./apps/api:/srv/pathforge/apps/api
      - ./mcp-servers:/srv/pathforge/mcp-servers
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
